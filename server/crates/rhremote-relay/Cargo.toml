[package]
name = "rhremote-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "RHRemoteRelay"
path = "src/main.rs"

[dependencies]
rhremote-transport = { path = "../../../transport/crates/rhremote-transport" }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
iroh-base = "=1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "signal", "macros"] }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tiny_http = "0.12"
