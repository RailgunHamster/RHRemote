[package]
name = "rhremote-ui"
version = "0.2.19"
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Explicit diagnostic build for comparison with the former WGL UI path.
ui-opengl = ["slint/renderer-femtovg"]
# Explicit Windows-only local lifecycle diagnostic; excluded from normal targets.
ui-overlay-probe = []

[[example]]
name = "overlay_lifecycle_probe"
path = "examples/overlay_lifecycle_probe.rs"
required-features = ["ui-overlay-probe"]

[lib]
name = "rhremote"
crate-type = ["rlib"]

[[bin]]
name = "RHRemote"
path = "src/main.rs"

[dependencies]
rhremote-core = { path = "../rhremote-core" }
rhremote-transport = { path = "../../../transport/crates/rhremote-transport" }
serde.workspace = true
serde_json.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls", "native-certs"] }
url = "2.5"
base64 = "0.22"
velopack = { version = "=1.2.110-ge826545", features=["public-utils"] }
roxmltree = "0.20"
pulldown-cmark = {version="=0.13.4",default-features=false}
image = {version="0.25",default-features=false,features=["png"]}
raw-window-handle = "0.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
tokio-rustls = {version="=0.26.6",default-features=false,features=["ring","tls12"]}
rustls-native-certs = "=0.8.5"
webpki-roots = "=1.0.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "=1.53.1", features = ["rt", "macros", "time"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
x11rb = { version = "0.13.2", features = ["shape", "randr"] }

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "=3.0.11"

[dev-dependencies]
tiny_http = "0.12"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
rcgen = "=0.14.10"

