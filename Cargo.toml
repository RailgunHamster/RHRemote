[workspace]
members = ["client/crates/rhremote-core", "client/crates/rhremote-ui", "server/crates/rhremote-host"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1

