[workspace]
members = ["client/crates/rhremote-core", "client/crates/rhremote-ui", "server/crates/rhremote-host", "transport/crates/rhremote-transport", "server/crates/rhremote-relay"]
exclude = ["client/vendor/i-slint-backend-winit", "client/vendor/i-slint-core"]
resolver = "3"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = 1

[patch.crates-io]
# Slint 1.18.1 plus PR #13568 and an opt-in per-pixel keyboard presenter.
i-slint-backend-winit = { path = "client/vendor/i-slint-backend-winit" }
# Slint 1.18.1 plus the upstream nested-clip Tab traversal fix.
i-slint-core = { path = "client/vendor/i-slint-core" }

