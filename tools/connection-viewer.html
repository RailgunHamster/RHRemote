<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RHRemote 连接统计</title>
<style>body{margin:0;background:#181818;color:#eee;font:14px system-ui,"Segoe UI",sans-serif}main{max-width:1200px;margin:auto;padding:28px}h1{font-size:22px;font-weight:600}h2{font-size:17px;margin-top:28px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{padding:16px 20px;background:#242424;border:1px solid #363636;border-radius:12px;min-width:150px}.label{font-size:12px;color:#aaa}.value{font-size:25px;margin-top:6px}.note{color:#bdbdbd;line-height:1.7}.lane{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:10px;margin:10px 0}.track{height:25px;position:relative;background:#252525;border-radius:5px}.bar{height:100%;position:absolute;background:#b88457;border-radius:5px;min-width:2px}.bar.ok{background:#769d82}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #393939}th{color:#aaa;font-weight:500}.scroll{overflow:auto}a{color:#e0ad7f}details{margin:12px 0;background:#222;padding:12px;border-radius:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace}.warn{color:#e5b984}button{font:inherit;color:inherit;background:#333;border:1px solid #555;border-radius:6px;padding:6px 10px;cursor:pointer}header{display:flex;align-items:center;justify-content:space-between}</style>
<main><header><h1>连接统计</h1><button id="download">下载汇总 JSON</button></header><div id="cards" class="cards"></div><p id="status" class="note"></p><h2>连接尝试</h2><div id="timeline"></div><div class="scroll"><table><thead><tr><th>尝试</th><th>线路 / 地址</th><th>开始</th><th>记录结束</th><th>首帧（自操作）</th><th>结果</th><th>明细</th></tr></thead><tbody id="rows"></tbody></table></div><div id="details"></div><p class="note">Windows 的 render_return 是 CPU 渲染提交返回，不是物理屏幕显示时刻。帧号和逐帧统计保持各次独立；未收到首帧时，不把失败结束时间写成首帧时间。无原始记录时仅显示历史报告，不能重新证明完整性。此报告不删除原始数据，也不代表帧率验收通过。</p></main>
<script>const D=/*RHREMOTE_CONNECTION_DATA*/;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};const ms=x=>x===null?'未收到':(x/1000).toFixed(3)+' 秒';
for(const [label,value] of [['首帧提交',ms(D.first_frame_ms)],['记录截至',ms(D.observed_until_ms)],['尝试次数',D.attempt_count],['原始完整性',D.raw_integrity_ok?'已校验':'存在缺失 / 未知']]){const card=el('div',undefined,'card');card.append(el('div',label,'label'),el('div',value,'value'));document.querySelector('#cards').append(card)}
document.querySelector('#status').textContent='主要结果：'+D.primary_outcome+'。同一应用启动、同一连接操作时间和同一 Sunshine UUID 才自动关联。';
D.attempts.forEach((a,i)=>{const lane=el('div',undefined,'lane'),track=el('div',undefined,'track'),bar=el('div',undefined,'bar'+(a.endpoint_us!==null?' ok':''));const span=Math.max(1,D.observed_until_ms);bar.style.left=Math.min(100,100*a.start_ms/span)+'%';bar.style.width=Math.max(.2,100*(a.end_ms-a.start_ms)/span)+'%';bar.title=a.outcome;track.append(bar);lane.append(el('span',(i+1)+' · '+a.outcome),track);document.querySelector('#timeline').append(lane);const row=el('tr');for(const value of [i+1,[a.route,a.address].filter(Boolean).join(' / ')||'未选定',ms(a.start_ms),ms(a.end_ms),ms(a.first_frame_from_request_ms),a.outcome])row.append(el('td',value));const linkCell=el('td');if(a.detail_report){const link=el('a','独立帧报告');link.href=a.detail_report;linkCell.append(link)}else linkCell.textContent='尚未生成独立报告';row.append(linkCell);document.querySelector('#rows').append(row);const details=el('details'),body=el('pre');details.append(el('summary','尝试 '+(i+1)+' · '+a.run_id));body.textContent=JSON.stringify({nativeFilePresent:a.native_file_present,nativeLaunchAnnounced:a.native_launch_announced,timeoutNativeMs:a.timeout_native_ms,protocolReadyObserved:a.protocol_ready_observed,rawIntegrityOk:a.raw_integrity_ok,warnings:a.warnings,phases:a.connection_phases,inputSha256:a.input_sha256},null,2);details.append(body);document.querySelector('#details').append(details)});
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='connection-summary.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
