name: Sunshine diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LizardByte/Sunshine
          ref: cb72dffa3233c5815cd5ba88f09f049dd679ba75
          path: sunshine
          submodules: false
          persist-credentials: false
      - name: Fetch Windows source dependencies
        shell: bash
        run: |
          git -C sunshine submodule update --init --depth 1 third-party/build-deps third-party/libdisplaydevice third-party/libvirtualhid third-party/lizardbyte-common third-party/moonlight-common-c third-party/nvapi third-party/Simple-Web-Server third-party/ViGEmClient
          git -C sunshine/third-party/moonlight-common-c submodule update --init --recursive --depth 1
          git -C sunshine/third-party/libvirtualhid submodule update --init --recursive --depth 1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-MinHook
      - name: Instrument pinned source
        shell: pwsh
        run: python tools/prepare-sunshine.py sunshine
      - name: Build instrumented baseline
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake -S sunshine -B sunshine/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_WERROR=OFF -DBUILD_TESTS=OFF -DBUILD_DOCS=OFF -DSUNSHINE_ENABLE_TRAY=OFF -DSUNSHINE_ASSETS_DIR=assets
          cmake --build sunshine/build --target sunshine --parallel 3
          mkdir -p artifacts/profile
          cp sunshine/build/sunshine.exe artifacts/profile/
      - name: Apply startup optimization
        shell: pwsh
        run: python tools/prepare-sunshine.py sunshine --optimized
      - name: Build optimized server
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
        run: |
          cmake --build sunshine/build --target sunshine --parallel 3
          mkdir -p artifacts/optimized
          cp sunshine/build/sunshine.exe artifacts/optimized/
      - name: Record binary hashes
        shell: pwsh
        run: |
          Get-ChildItem artifacts -Recurse -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content artifacts/hashes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sunshine-diagnostics-x64
          path: artifacts/
          retention-days: 3
