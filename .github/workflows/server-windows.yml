name: RHRemote-Sunshine Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/sunshine/**'
      - 'server/UPSTREAM.json'
      - 'server/ffmpeg/**'
      - 'server/crates/**'
      - 'server/host/**'
      - '.gitmodules'
      - 'tools/build-server.ps1'
      - 'tools/build-host.ps1'
      - 'tools/assemble-server.ps1'
      - 'tools/server-package.ps1'
      - 'tools/install-server.ps1'
      - 'tools/configure-network.ps1'
      - 'tools/test-server-package.ps1'
      - 'tools/analyze-host-frames.py'
      - 'tools/test_host_frame_analysis.py'
      - 'tools/analyze-statistics.py'
      - 'tools/test-statistics.py'
      - 'tools/analyze-media-window.py'
      - 'tools/test_media_window_analysis.py'
      - 'tools/host-encoder-window.ps1'
      - 'tools/test-host-encoder-window.ps1'
      - '.github/workflows/server-windows.yml'
permissions:
  contents: read
jobs:
  frame-trace-portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise bounded recorder and PTS history without GPU dependencies
        run: |
          g++ -std=c++23 -pthread -DRHREMOTE_FRAME_TRACE_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_frame_trace.cpp -o test-rhremote-frame-trace
          ./test-rhremote-frame-trace
          g++ -std=c++23 -DRHREMOTE_VIDEO_PACING_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_video_pacing.cpp -o test-rhremote-video-pacing
          ./test-rhremote-video-pacing
          g++ -std=c++23 -DRHREMOTE_INTEL_MF_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_intel_mf_probe.cpp -o test-rhremote-intel-mf-probe
          ./test-rhremote-intel-mf-probe
          g++ -std=c++23 -pthread -DRHREMOTE_PENDING_LAUNCH_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_pending_launch.cpp -o test-rhremote-pending-launch
          ./test-rhremote-pending-launch
          g++ -std=c++23 -pthread -DRHREMOTE_LAUNCH_HTTP_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_launch_http.cpp -o test-rhremote-launch-http
          ./test-rhremote-launch-http
      - name: Analyze incomplete, reordered and closed host traces
        run: |
          python -m unittest discover -s server/ffmpeg -p test_prepare_mf.py -v
          python -m unittest discover -s tools -p test_host_frame_analysis.py -v
          python -m unittest discover -s tools -p test_media_window_analysis.py -v
          python tools/test-statistics.py
      - name: Check recorder publication and close under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          g++ -std=c++23 -g -O1 -fsanitize=thread -fno-omit-frame-pointer -no-pie -pthread -DRHREMOTE_FRAME_TRACE_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_frame_trace.cpp -o test-rhremote-frame-trace-tsan
          ./test-rhremote-frame-trace-tsan
          g++ -std=c++23 -g -O1 -fsanitize=thread -fno-omit-frame-pointer -no-pie -pthread -DRHREMOTE_PENDING_LAUNCH_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_pending_launch.cpp -o test-rhremote-pending-launch-tsan
          ./test-rhremote-pending-launch-tsan
          g++ -std=c++23 -g -O1 -fsanitize=thread -fno-omit-frame-pointer -no-pie -pthread -DRHREMOTE_LAUNCH_HTTP_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_launch_http.cpp -o test-rhremote-launch-http-tsan
          ./test-rhremote-launch-http-tsan
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: false
          persist-credentials: false
      - name: Verify upstream pins
        shell: pwsh
        run: python tools/sync-sunshine-dependencies.py --check
      - name: Build and test the unified Rust service
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          if($LASTEXITCODE-ne0){throw 'Rust toolchain setup failed'}
          cargo +1.92.0 test -p rhremote-host --locked -j4
          if($LASTEXITCODE-ne0){throw 'Host service regressions failed'}
          ./tools/test-server-package.ps1
          ./tools/test-host-encoder-window.ps1
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tools/test-host-encoder-window.ps1
          if($LASTEXITCODE-ne0){throw 'Windows PowerShell encoder config regressions failed'}
          ./tools/build-host.ps1 -Release
      - name: Fetch Windows source dependencies
        shell: bash
        run: |
          git submodule update --init --depth 1 -- server/sunshine/third-party/build-deps server/sunshine/third-party/libdisplaydevice server/sunshine/third-party/libvirtualhid server/sunshine/third-party/lizardbyte-common server/sunshine/third-party/moonlight-common-c server/sunshine/third-party/nvapi server/sunshine/third-party/Simple-Web-Server server/sunshine/third-party/ViGEmClient
          git -C server/sunshine/third-party/moonlight-common-c submodule update --init --recursive --depth 1
          git -C server/sunshine/third-party/libvirtualhid submodule update --init --recursive --depth 1
          git -C server/sunshine/third-party/lizardbyte-common submodule update --init --recursive --depth 1
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          msystem: ucrt64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cppwinrt
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-MinHook
      - name: Build maintained server, service and web UI
        shell: msys2 {0}
        env:
          MSYS2_PATH_TYPE: inherit
          BRANCH: main
          BUILD_VERSION: 0.2.1
          COMMIT: ${{ github.sha }}
        run: |
          g++ -std=c++23 -DRHREMOTE_DEVICE_PROBE_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_device_probe.cpp -o test-rhremote-device-probe.exe
          ./test-rhremote-device-probe.exe
          g++ -std=c++23 -DRHREMOTE_ENCODER_PROBE_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_encoder_probe.cpp -o test-rhremote-encoder-probe.exe
          ./test-rhremote-encoder-probe.exe
          g++ -std=c++23 -DRHREMOTE_INTEL_MF_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_intel_mf_probe.cpp -o test-rhremote-intel-mf-probe.exe
          ./test-rhremote-intel-mf-probe.exe
          g++ -std=c++23 -DRHREMOTE_INITIAL_DISPLAY_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_initial_display.cpp -o test-rhremote-initial-display.exe
          ./test-rhremote-initial-display.exe
          g++ -std=c++23 -pthread -DRHREMOTE_FRAME_TRACE_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_frame_trace.cpp -o test-rhremote-frame-trace.exe
          ./test-rhremote-frame-trace.exe
          g++ -std=c++23 -DRHREMOTE_VIDEO_PACING_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_video_pacing.cpp -o test-rhremote-video-pacing.exe
          ./test-rhremote-video-pacing.exe
          g++ -std=c++23 -pthread -DRHREMOTE_PENDING_LAUNCH_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_pending_launch.cpp -o test-rhremote-pending-launch.exe
          ./test-rhremote-pending-launch.exe
          g++ -std=c++23 -pthread -DRHREMOTE_LAUNCH_HTTP_STANDALONE -Iserver/sunshine server/sunshine/tests/unit/test_rhremote_launch_http.cpp -o test-rhremote-launch-http.exe
          ./test-rhremote-launch-http.exe
          cmake -S server/sunshine -B .deps/cmake-build-server -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_WERROR=OFF -DBUILD_TESTS=ON -DBUILD_DOCS=OFF -DSUNSHINE_ENABLE_TRAY=OFF -DSUNSHINE_ASSETS_DIR=assets
          cmake --build .deps/cmake-build-server --target sunshine sunshinesvc dxgi-info audio-info web-ui test_sunshine test_rhremote_mf_variant --parallel 3
          ./.deps/cmake-build-server/test_rhremote_mf_variant.exe
          cmake --install .deps/cmake-build-server --prefix "$PWD/.deps/server-stage"
          cp server/UPSTREAM.json server/sunshine/LICENSE .deps/server-stage/
      - name: Test pairing sessions and client authorization
        shell: msys2 {0}
        working-directory: .deps/cmake-build-server/tests
        run: ./test_sunshine.exe --gtest_color=yes '--gtest_filter=*Pairing*:*ClientAuth*:*RhRemoteEncoderProbe*:*RhRemoteEncoderTrace*:*RhRemoteIntelMfProbe*:*RhRemoteDeviceProbe*:*RhRemoteInitialDisplay*:*RhRemoteFrameTrace*:*RhRemoteVideoPacing*:*RhRemotePendingLaunch*:*RhRemoteLaunchHttp*' --gtest_output=xml:pairing-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: RHRemote-Sunshine-pairing-tests
          path: .deps/cmake-build-server/tests/pairing-results.xml
          retention-days: 7
      - name: Assemble one-service server package
        shell: pwsh
        run: ./tools/assemble-server.ps1 -SunshineDirectory .deps/server-stage -OutputDirectory artifacts/server -EngineCommit $env:GITHUB_SHA
      - name: Verify output and record provenance
        shell: pwsh
        run: |
          foreach($file in @('sunshine.exe','host/RHRemoteHost.exe','assets/web/index.html','server-package.json')){
            if(-not(Test-Path -LiteralPath (Join-Path artifacts/server $file))){throw "Incomplete output: $file"}
          }
          $product=(Get-Item artifacts/server/sunshine.exe).VersionInfo.ProductName
          if($product-ne'RHRemote-Sunshine'){throw "Unexpected server branding: $product"}
          @{commit=$env:GITHUB_SHA;upstream=(Get-Content server/UPSTREAM.json -Raw|ConvertFrom-Json).revision;product=$product} | ConvertTo-Json | Set-Content artifacts/provenance.json
          Get-ChildItem artifacts/server -Recurse -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content artifacts/hashes.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: RHRemote-Sunshine-windows-x64
          path: artifacts/
          retention-days: 7
